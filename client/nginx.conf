server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/nginx-locations.conf;
}

# HTTPS with a self-signed cert (see docker-entrypoint-tls.sh), so the site can be reached as a
# "secure context" - required by browsers before they expose camera access for the in-page QR
# scanner. Browsers will show a certificate warning on first visit to this port; that's expected
# for a self-signed cert and only needs accepting once per device. A real deployment with a real
# domain (e.g. Vercel) gets a trusted certificate automatically and doesn't need this at all.
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    include /etc/nginx/nginx-locations.conf;
}
