server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The UI never needs to know the backend's host/port - it only ever calls
    # same-origin relative paths (/api, /uploads), and this proxy resolves them
    # to the "server" container by its Docker Compose service name.
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://server:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client-side routing (React Router) - fall back to index.html for any
    # route that isn't a real static file or one of the proxied paths above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
