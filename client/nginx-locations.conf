# Shared between the HTTP and HTTPS server blocks in nginx.conf - kept as one file so the
# proxy rules never drift apart between the two.

# nginx defaults to 1m, which rejects image uploads and backup restores with a
# bare HTML 413 before they ever reach the API. Sized for the largest body the
# API accepts: a full backup restore (express.json is capped at 25mb).
client_max_body_size 25m;

# The UI never needs to know the backend's host/port - it only ever calls
# same-origin relative paths (/api, /uploads), and this proxy resolves them
# to the "server" container by its Docker Compose service name.
location /api/ {
    proxy_pass http://server:5000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
}

# The API's own health check (it also checks the database), so an uptime monitor can watch the real thing.
location = /health {
    proxy_pass http://server:5000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /uploads/ {
    proxy_pass http://server:5000/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Client-side routing (React Router) - fall back to index.html for any
# route that isn't a real static file or one of the proxied paths above.
# index.html is passed through nginx's server-side includes, which fill in the title, description and keywords
# set in Admin > Landing page > Google search (GET /api/landing/seo-head), so Google sees them in the first HTML.
# If the API cannot be reached the page keeps its plain title.
location / {
    ssi on;
    ssi_silent_errors on;
    try_files $uri $uri/ /index.html;
}
