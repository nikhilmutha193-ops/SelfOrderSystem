services:
  # MONGO_URI must point at an external MongoDB (e.g. Atlas) - set it in a .env file at the repo root.
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in a .env file at the repo root - see .env.example}
      RESTAURANT_KEY: ${RESTAURANT_KEY:-resto_demo}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file at the repo root - see .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLIENT_ORIGIN: "*"
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off: `docker compose run --rm seed` after the stack is up, to create the
  # restaurant/admin/chef/tables/menu for RESTAURANT_KEY. Not part of `up` by default.
  seed:
    build:
      context: ./server
    profiles: ["seed"]
    environment:
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in a .env file at the repo root - see .env.example}
      RESTAURANT_KEY: ${RESTAURANT_KEY:-resto_demo}
    command: ["node", "dist/utils/seed.js"]

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  uploads_data:
  backups_data:
