services:
  # A single-node replica set (transactions need a replica set, even with one member - see
  # CLAUDE.md). The healthcheck initiates it once on first boot: rs.status() fails until then,
  # the catch calls rs.initiate(), and later checks just see rs.status().ok. Published on 27017
  # so `npm run dev` (outside Docker) and Compass can reach it too.
  mongo:
    image: mongo:7
    restart: unless-stopped
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate().ok }"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # MONGO_URI defaults to the bundled mongo service above; set it in a .env file at the repo
  # root to point at an external MongoDB (e.g. Atlas) instead - see .env.example.
  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/selforder?replicaSet=rs0}
      RESTAURANT_KEY: ${RESTAURANT_KEY:-resto_demo}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file at the repo root - see .env.example}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Comma-separated exact-match allow-list of redirect URIs an OAuth client (e.g. an MCP
      # host) may use with /api/oauth/authorize. Empty means the OAuth flow rejects everything.
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-}
      # Browser traffic reaches the API same-origin through the client's nginx, so this
      # only matters if the API is exposed directly. Set CLIENT_ORIGIN in .env to your
      # real site origin(s), comma-separated, to lock cross-origin access down from "*".
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-*}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
      # Texts guests when a table booking is confirmed or cancelled/no-show. Leave unset to skip SMS entirely.
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off: `docker compose run --rm seed` after the stack is up, to create the
  # restaurant/admin/chef/tables/menu for RESTAURANT_KEY. Not part of `up` by default.
  seed:
    build:
      context: ./server
    profiles: ["seed"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/selforder?replicaSet=rs0}
      RESTAURANT_KEY: ${RESTAURANT_KEY:-resto_demo}
    command: ["node", "dist/utils/seed.js"]

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Extra Subject Alternative Name(s) for the self-signed HTTPS cert, so it's also valid
      # for your LAN IP, e.g. TLS_EXTRA_SAN=IP:192.168.1.20 in your .env. Needed for camera
      # access (the in-page QR scanner) to work when a phone opens the site over the LAN -
      # browsers only expose the camera on a "secure context" (HTTPS, or localhost).
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
    ports:
      - "${CLIENT_PORT:-8080}:80"
      - "${CLIENT_TLS_PORT:-8443}:443"
    volumes:
      # Persists the generated self-signed cert across restarts/redeploys, so browsers don't
      # need the one-time "accept this certificate" warning re-done every time you redeploy -
      # only the first time, or after `docker compose down -v` / removing this volume.
      - client_tls:/etc/nginx/tls

volumes:
  mongo_data:
  uploads_data:
  backups_data:
  client_tls:
