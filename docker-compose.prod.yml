# Production stack for a Docker server.
#
#   cp .env.production.example .env      (then fill it in)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm seed     (first time only)
#
# Differences from docker-compose.yml (which is meant for a laptop):
#   - MongoDB is NOT published on the host. Only the web ports are.
#   - Every service restarts on its own and logs are capped, so the disk cannot fill up.
#   - Images can be pulled from a registry (set IMAGE_REGISTRY and IMAGE_TAG) instead of built on the server.
#   - For a trusted HTTPS certificate on a real domain, add docker-compose.https.yml (see docs/DEPLOY.md).
#
# See docs/DEPLOY.md for the full guide.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # A single-node replica set: billing, purchases and stock counts use transactions, which MongoDB only
  # allows on a replica set. The healthcheck starts the set the first time the container runs.
  # To use MongoDB Atlas instead, set MONGO_URI in .env and remove this service and the depends_on lines.
  mongo:
    # MongoDB 5 and newer need a CPU with AVX. If `grep -c avx /proc/cpuinfo` prints 0 on your VPS, set MONGO_IMAGE=mongo:4.4 in .env.
    image: ${MONGO_IMAGE:-mongo:7}
    restart: always
    init: true
    # A normal open-files limit. Many Linux servers hand containers a limit of about a billion, and MongoDB's start-up
    # script then spins at 100% CPU for minutes without ever starting mongod (the container never becomes healthy).
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    hostname: mongo
    # Run mongod directly instead of through the image's docker-entrypoint.sh. On some servers (seen with Docker 29)
    # that script spins at 100% CPU and never starts MongoDB, so the container never becomes healthy. Nothing in the
    # script is needed here: the volume is already owned by the mongodb user, and the replica set is started by the
    # healthcheck below.
    entrypoint: ["mongod"]
    user: mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      # A Docker volume called mongo_data by default. Set MONGO_DATA_DIR in .env to a folder on the server (for example
      # /opt/selforder-data/mongo) to keep the database in a normal folder instead; see docs/DEPLOY.md, "Keeping the data safe".
      - ${MONGO_DATA_DIR:-mongo_data}:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate().ok }"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    logging: *logging

  server:
    image: ${IMAGE_REGISTRY:-selforder}/server:${IMAGE_TAG:-latest}
    build:
      context: ./server
      args:
        APP_VERSION: ${IMAGE_TAG:-dev}
    restart: always
    init: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/selforder?replicaSet=rs0}
      RESTAURANT_KEY: ${RESTAURANT_KEY:?Set RESTAURANT_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Your site's address, for example https://order.example.com (comma separated for several).
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env to your site address}
      # 1 = only the client container's nginx is in front of the API; 2 when Caddy (docker-compose.https.yml) is too.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
      - invoices_data:/app/invoices
      - proofs_data:/app/proofs
      - config_data:/app/config-data
      - ./downloads:/app/downloads:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # One-off: `docker compose -f docker-compose.prod.yml run --rm seed` creates the restaurant, sample logins
  # and a sample menu for RESTAURANT_KEY. Run it once on a new database; never on one that has real data.
  seed:
    image: ${IMAGE_REGISTRY:-selforder}/server:${IMAGE_TAG:-latest}
    profiles: ["seed"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/selforder?replicaSet=rs0}
      RESTAURANT_KEY: ${RESTAURANT_KEY:?Set RESTAURANT_KEY in .env}
    command: ["node", "dist/utils/seed.js"]

  client:
    image: ${IMAGE_REGISTRY:-selforder}/client:${IMAGE_TAG:-latest}
    build:
      context: ./client
      args:
        APP_VERSION: ${IMAGE_TAG:-dev}
    restart: always
    init: true
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Extra names for the self-signed certificate, for example DNS:order.example.com or IP:203.0.113.10.
      TLS_EXTRA_SAN: ${TLS_EXTRA_SAN:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - client_tls:/etc/nginx/tls
    logging: *logging

volumes:
  mongo_data:
  uploads_data:
  backups_data:
  invoices_data:
  proofs_data:
  config_data:
  client_tls:
